name: build-lecture-pdfs

# Trigger on push to the main branch. This is prefered to triggering on pull
# requests, as it prevents unnecessary repeated commits of changed slides.pdf
# files while a pull request is being worked on.
on:
  push:
    branches: "main"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v5

    - name: Get changed lectures
      id: changed-lectures
      uses: tj-actions/changed-files@v47.0.2
      with:
        dir_names: true
        files: |
          lectures/**/{README.md,index.html}

    - if: steps.changed-lectures.outputs.any_changed == 'true'
      name: List changed lectures
      env:
        ALL_CHANGED_DIRS: ${{ steps.changed-lectures.outputs.all_changed_files }}
      run: |
        for dir in ${ALL_CHANGED_DIRS}; do
          echo "Slides in '${dir}' have changed"
        done

    - if: steps.changed-lectures.outputs.any_changed == 'true'
      name: Install dependencies
      run: npm install -g decktape

    - if: steps.changed-lectures.outputs.any_changed == 'true'
      name: Generate lecture slides
      env:
        ALL_CHANGED_DIRS: ${{ steps.changed-lectures.outputs.all_changed_files }}
      run: |
        for dir in ${ALL_CHANGED_DIRS}; do
          decktape --chrome-arg=--disable-web-security --chrome-arg=--no-sandbox remark ${{ github.workspace }}/${dir}/index.html ${{ github.workspace }}/${dir}/slides.pdf
        done

    - if: steps.changed-lectures.outputs.any_changed == 'true'
      name: Commit and push PDFs
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add lectures/**/slides.pdf
        git commit -m "Update generated PDFs" || echo "No changes to commit"
        git push
